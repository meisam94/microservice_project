server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: user-service
              uri: lb://user-service
              predicates:
                - path=/api/users/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - path=/api/products/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - path=/api/orders/**


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
