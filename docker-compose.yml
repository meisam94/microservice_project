services:

 # =========================
 # User Database
 # =========================

 user-db:
  image: mysql:8.0
  container_name: user-db

  environment:
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
   MYSQL_DATABASE: ${USER_DB_NAME}

  volumes:
   - user-db-data:/var/lib/mysql

  networks:
   - microservice-network


 # =========================
 # Product Database
 # =========================

 product-db:
  image: mysql:8.0
  container_name: product-db

  environment:
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
   MYSQL_DATABASE: ${PRODUCT_DB_NAME}

  volumes:
   - product-db-data:/var/lib/mysql

  networks:
   - microservice-network


 # =========================
 # Order Database
 # =========================

 order-db:
  image: mysql:8.0
  container_name: order-db

  environment:
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
   MYSQL_DATABASE: ${ORDER_DB_NAME}

  volumes:
   - order-db-data:/var/lib/mysql

  networks:
   - microservice-network


 # =========================
 # Eureka Server
 # =========================

 eureka-server:
  build:
   context: ./eureka-server
   dockerfile: Dockerfile

  container_name: eureka-server

  ports:
   - "8761:8761"

  networks:
   - microservice-network


 # =========================
 # User Service
 # =========================

 user-service:
  build:
   context: ./user
   dockerfile: Dockerfile

  container_name: user-service

  ports:
   - "8081:8081"

  environment:
   SPRING_DATASOURCE_URL: jdbc:mysql://user-db:3306/user_db
   SPRING_DATASOURCE_USERNAME: root
   SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

   EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  depends_on:
   - user-db
   - eureka-server

  networks:
   - microservice-network


 # =========================
 # Product Service
 # =========================

 product-service:
  build:
   context: ./product
   dockerfile: Dockerfile

  container_name: product-service

  ports:
   - "8082:8082"

  environment:
   SPRING_DATASOURCE_URL: jdbc:mysql://product-db:3306/product_db
   SPRING_DATASOURCE_USERNAME: root
   SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

   EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  depends_on:
   - product-db
   - eureka-server

  networks:
   - microservice-network


 # =========================
 # Order Service
 # =========================

 order-service:
  build:
   context: ./order
   dockerfile: Dockerfile

  container_name: order-service

  ports:
   - "8083:8083"

  environment:
   SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/order_db
   SPRING_DATASOURCE_USERNAME: root
   SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

   EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  depends_on:
   - order-db
   - eureka-server
   - user-service
   - product-service

  networks:
   - microservice-network


 # =========================
 # API Gateway
 # =========================

 api-gateway:
  build:
   context: ./api-getway
   dockerfile: Dockerfile

  container_name: api-gateway

  ports:
   - "8080:8080"

  environment:
   EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  depends_on:
   - eureka-server
   - user-service
   - product-service
   - order-service

  networks:
   - microservice-network


# =========================
# Volumes
# =========================

volumes:
 user-db-data:
 product-db-data:
 order-db-data:


# =========================
# Network
# =========================

networks:
 microservice-network:
  driver: bridge